<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="1000"
  viewBox="0 0 1600 1000"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">MatrixHub code dependency architecture</title>
  <desc id="description">
    An arrow from A to B means A depends on or imports B. Handler middleware and
    job processors depend on domain and infrastructure. The repository
    implementation depends on domain and infrastructure. Domain depends on
    infrastructure. Inside the domain, the domain service depends on entities
    and the repository interface, and the repository interface depends on
    entities. Domain never depends on or directly calls the repository
    implementation.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 11 10"
      refX="10"
      refY="5"
      markerWidth="10"
      markerHeight="10"
      orient="auto-start-reverse"
    >
      <path
        d="M 1 1 L 10 5 L 1 9"
        fill="none"
        stroke="#111827"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </marker>
  </defs>

  <!-- A fixed white canvas and explicit colors keep the diagram readable in dark mode. -->
  <rect width="1600" height="1000" fill="#ffffff" />

  <!-- Package boundaries. -->
  <rect
    x="50"
    y="310"
    width="1040"
    height="440"
    rx="10"
    fill="#f1f4fc"
    stroke="#111827"
    stroke-width="4"
  />
  <rect
    x="1270"
    y="50"
    width="290"
    height="900"
    rx="12"
    fill="#f1f4fc"
    stroke="#111827"
    stroke-width="4"
  />

  <!-- Dependencies between top-level packages. -->
  <g
    fill="none"
    stroke="#111827"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
    marker-end="url(#arrow)"
  >
    <path d="M 834 115 L 1260 108" />
    <path d="M 565 190 L 570 300" />
    <path d="M 1100 530 L 1260 530" />
    <path d="M 782 902 L 1260 902" />
    <path d="M 570 846 L 570 760" stroke-dasharray="10 10" />
  </g>

  <!-- Dependencies inside the domain package. -->
  <g
    fill="none"
    stroke="#111827"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
    marker-end="url(#arrow)"
  >
    <path d="M 402 473 L 294 505" />
    <path d="M 560 473 L 824 556" />
    <path d="M 600 609 L 470 609" />
  </g>

  <!-- Modules. -->
  <g fill="#f1f4fc" stroke="#111827" stroke-width="4">
