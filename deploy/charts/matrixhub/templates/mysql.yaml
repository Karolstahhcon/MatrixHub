{{- if and .Values.global.storage.apiserver.builtIn (eq .Values.apiserver.database.driver "mysql") (not .Values.apiserver.database.dsn) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "matrixhub.fullname" . }}-mysql-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "matrixhub.labels" . | nindent 4 }}
type: Opaque
data:
  mysql-root-password: {{ .Values.mysql.rootPassword | b64enc | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "matrixhub.fullname" . }}-mysql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "matrixhub.labels" . | nindent 4 }}
spec:
  ports:
    - port: 3306
      targetPort: mysql
      protocol: TCP
      name: mysql
  selector:
    app: {{ include "matrixhub.fullname" . }}-mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "matrixhub.fullname" . }}-mysql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "matrixhub.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "matrixhub.fullname" . }}-mysql
  selector:
    matchLabels:
      app: {{ include "matrixhub.fullname" . }}-mysql
  template:
    metadata:
      labels:
        app: {{ include "matrixhub.fullname" . }}-mysql
    spec:
