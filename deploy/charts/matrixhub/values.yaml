apiserver:
  # -- matrixhub-apiserver deployment labels
  labels:
    # -- matrixhub-apiserver deployment app name
    app: matrixhub
  # -- target replicas
  replicaCount: 1
  # -- Add matrixhub apiserver pod annotations
  podAnnotations: {}
  # -- Add matrixhub apiserver pod labels
  podLabels: {}

  # -- image configuration
  image:
    # -- matrixhub image registry
    registry: ghcr.io
    repository: Karolstahhcon/matrixhub
    # -- The image tag
    tag: ""
    # -- Pull policy of image
    pullPolicy: IfNotPresent
    # -- Pull secrets
    pullSecrets: []

  # -- Resource configuration
  resources:
    # -- resource limits
    limits:
      cpu: 500m
      memory: 512Mi
    # -- resource requests
    requests:
      cpu: 50m
      memory: 128Mi

  # -- service configuration
  service:
    # -- service type
    type: ClusterIP
    # -- service port
