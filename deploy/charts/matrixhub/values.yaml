apiserver:
  # -- matrixhub-apiserver deployment labels
  labels:
    # -- matrixhub-apiserver deployment app name
    app: matrixhub
  # -- target replicas
  replicaCount: 1
  # -- Add matrixhub apiserver pod annotations
  podAnnotations: {}
  # -- Add matrixhub apiserver pod labels
  podLabels: {}

  # -- image configuration
  image:
    # -- matrixhub image registry
    registry: ghcr.io
    repository: Karolstahhcon/matrixhub
    # -- The image tag
    tag: ""
    # -- Pull policy of image
    pullPolicy: IfNotPresent
    # -- Pull secrets
    pullSecrets: []

  # -- Resource configuration
  resources:
    # -- resource limits
    limits:
      cpu: 500m
      memory: 512Mi
    # -- resource requests
    requests:
      cpu: 50m
      memory: 128Mi

  # -- service configuration
  service:
    # -- service type
    type: ClusterIP
    # -- service port
    port: 9527
    # -- node port
    nodePort: 30001
    # -- SSH node port
    sshNodePort: 30022
    # -- service annotations
    annotations: {}

  # -- debug mode
  debug: false
  # -- log level
  logLevel: "warn"

  # -- database configuration
  database:
    # -- database driver (mysql/postgres)
    driver: mysql
    # -- database access type
    accessType: readwrite
    # -- max open connections
    maxOpenConns: 100
    # -- max idle connections
    maxIdleConns: 10
    # -- connection max lifetime seconds
    connMaxLifetimeSeconds: 3600
    # -- connection max idle seconds
    connMaxIdleSeconds: 1800
    # -- enable database migration
    migrate: true
    # -- migration path
    migrationPath: /etc/matrixhub/migrations
    # -- custom DSN for external database
    dsn: ""

  # -- api server port
  port: 9527
  # -- ssh server port
  sshPort: 22

  # -- Base HTTP URL returned to SSH Git LFS clients. It must be reachable by
